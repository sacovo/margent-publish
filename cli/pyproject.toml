[project]
name = "margent"
version = "0.1.0"
description = "Publish static builds to Margent (margent push)."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
margent = "margent.cli:main"

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.0", "ruff>=0.17"]

[tool.pytest.ini_options]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
